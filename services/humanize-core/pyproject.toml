[project]
name = "humanize-core"
version = "0.1.0"
description = "Internal rewrite core service for short business writing polish."
requires-python = ">=3.12"
dependencies = [
  "anthropic>=0.75.0",
  "cryptography>=46.0.0",
  "fastapi>=0.128.0",
  "langgraph>=1.0.8",
  "openai>=2.0.0",
  "pydantic>=2.12.0",
  "pydantic-settings>=2.12.0",
  "uvicorn[standard]>=0.38.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28.0",
  "pytest>=9.0.0",
  "pytest-asyncio>=1.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# packages already ships every file under humanize_core/ (md/json resources
# included). Do not force-include them again: recent hatchling versions fail
# the build on duplicate archive paths.
packages = ["humanize_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
